services:
  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: file:/data/avalon.db
      FRONTEND_ORIGIN: "*"
      REJOIN_TOKEN_PEPPER: ${REJOIN_TOKEN_PEPPER:-local-development-pepper-change-me}
    volumes:
      - avalon-data:/data
volumes:
  avalon-data:
